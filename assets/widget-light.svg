<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="wBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F6F6F9" />
      <stop offset="100%" stop-color="#ECECF2" />
    </linearGradient>

    <linearGradient id="barGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B2D42" />
      <stop offset="50%" stop-color="#4A4E69" />
      <stop offset="100%" stop-color="#9A8C98" />
    </linearGradient>

    <linearGradient id="wBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A8C98" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#4A4E69" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2B2D42" stop-opacity="0.4" />
    </linearGradient>

    <!-- Bar Animation -->
    <style>
      @keyframes eqPulse {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1); }
      }
      .eq-1 { animation: eqPulse 1.4s ease-in-out infinite; transform-origin: bottom; }
      .eq-2 { animation: eqPulse 1.8s ease-in-out infinite 0.2s; transform-origin: bottom; }
      .eq-3 { animation: eqPulse 1.2s ease-in-out infinite 0.4s; transform-origin: bottom; }
      .eq-4 { animation: eqPulse 1.6s ease-in-out infinite 0.1s; transform-origin: bottom; }
      .eq-5 { animation: eqPulse 2.0s ease-in-out infinite 0.5s; transform-origin: bottom; }
      .eq-6 { animation: eqPulse 1.3s ease-in-out infinite 0.3s; transform-origin: bottom; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="226" rx="14" fill="url(#wBgLight)" stroke="url(#wBorderLight)" stroke-width="1.5" />

  <!-- Section 1: Developer Info (Left) -->
  <g transform="translate(30, 28)">
    <text class="mono" font-size="11" fill="#4A4E69" letter-spacing="1.5">// SYSTEM_PROFILE</text>
    <text y="28" class="sans" font-size="19" font-weight="700" fill="#2B2D42">x1ax</text>
    <text y="50" class="sans" font-size="13" fill="#4A4E69">Фронтенд, веб-разработка, интерфейсы</text>
    
    <!-- Status Pill -->
    <g transform="translate(0, 68)">
      <rect width="130" height="24" rx="12" fill="#FFFFFF" stroke="#9A8C98" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#2D6A4F" />
      <text x="22" y="16" class="mono" font-size="10.5" fill="#2B2D42">STATUS: ONLINE</text>
    </g>

    <!-- Discord tag pill -->
    <g transform="translate(140, 68)">
      <rect width="145" height="24" rx="12" fill="#FFFFFF" stroke="#4A4E69" stroke-width="1" />
      <text x="12" y="16" class="mono" font-size="10.5" fill="#2B2D42">DC: xvanaks</text>
    </g>

    <!-- Quote / Mood -->
    <text y="122" class="mono" font-size="12" fill="#2B2D42">
      "пишу код, пока не заработает как надо"
    </text>
    <text y="142" class="mono" font-size="11" fill="#4A4E69">
      commit early, refactor often
    </text>
  </g>

  <!-- Divider 1 -->
  <line x1="335" y1="25" x2="335" y2="205" stroke="#9A8C98" stroke-width="1" stroke-opacity="0.35" />

  <!-- Section 2: Skill Gauges (Center) -->
  <g transform="translate(365, 28)">
    <text class="mono" font-size="11" fill="#4A4E69" letter-spacing="1.5">// TECH_DISTRIBUTION</text>

    <!-- Bar 1: JS / TS -->
    <g transform="translate(0, 22)">
      <text class="mono" font-size="12" fill="#2B2D42">TypeScript &amp; JS</text>
      <text x="210" class="mono" font-size="11" fill="#4A4E69">88%</text>
      <rect y="8" width="230" height="6" rx="3" fill="#E8E8EF" />
      <rect y="8" width="202" height="6" rx="3" fill="url(#barGradLight)" />
    </g>

    <!-- Bar 2: UI / CSS -->
    <g transform="translate(0, 56)">
      <text class="mono" font-size="12" fill="#2B2D42">HTML / CSS / Tailwind</text>
      <text x="210" class="mono" font-size="11" fill="#4A4E69">92%</text>
      <rect y="8" width="230" height="6" rx="3" fill="#E8E8EF" />
      <rect y="8" width="211" height="6" rx="3" fill="url(#barGradLight)" />
    </g>

    <!-- Bar 3: React / Frontend -->
    <g transform="translate(0, 90)">
      <text class="mono" font-size="12" fill="#2B2D42">React / SPA</text>
      <text x="210" class="mono" font-size="11" fill="#4A4E69">80%</text>
      <rect y="8" width="230" height="6" rx="3" fill="#E8E8EF" />
      <rect y="8" width="184" height="6" rx="3" fill="url(#barGradLight)" />
    </g>

    <!-- Bar 4: Python / Backend -->
    <g transform="translate(0, 124)">
      <text class="mono" font-size="12" fill="#2B2D42">Python / Scripts</text>
      <text x="210" class="mono" font-size="11" fill="#4A4E69">65%</text>
      <rect y="8" width="230" height="6" rx="3" fill="#E8E8EF" />
      <rect y="8" width="150" height="6" rx="3" fill="url(#barGradLight)" />
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="630" y1="25" x2="630" y2="205" stroke="#9A8C98" stroke-width="1" stroke-opacity="0.35" />

  <!-- Section 3: Visual Wave / Vibe (Right) -->
  <g transform="translate(660, 28)">
    <text class="mono" font-size="11" fill="#4A4E69" letter-spacing="1.5">// VIBE_EQUALIZER</text>

    <!-- Animated Audio / Pulse Bars -->
    <g transform="translate(10, 120)">
      <!-- Base line -->
      <line x1="-5" y1="0" x2="185" y2="0" stroke="#9A8C98" stroke-width="1" stroke-opacity="0.4" />
      
      <rect x="5" y="-55" width="8" height="55" rx="4" fill="#2B2D42" class="eq-1" />
      <rect x="23" y="-75" width="8" height="75" rx="4" fill="#4A4E69" class="eq-2" />
      <rect x="41" y="-45" width="8" height="45" rx="4" fill="#9A8C98" class="eq-3" />
      <rect x="59" y="-85" width="8" height="85" rx="4" fill="#2B2D42" class="eq-4" />
      <rect x="77" y="-60" width="8" height="60" rx="4" fill="#4A4E69" class="eq-5" />
      <rect x="95" y="-95" width="8" height="95" rx="4" fill="#9A8C98" class="eq-6" />
      <rect x="113" y="-50" width="8" height="50" rx="4" fill="#2B2D42" class="eq-2" />
      <rect x="131" y="-70" width="8" height="70" rx="4" fill="#4A4E69" class="eq-4" />
      <rect x="149" y="-40" width="8" height="40" rx="4" fill="#9A8C98" class="eq-1" />
      <rect x="167" y="-65" width="8" height="65" rx="4" fill="#2B2D42" class="eq-3" />
    </g>

    <!-- Bottom activity note -->
    <g transform="translate(10, 150)">
      <text class="mono" font-size="11" fill="#2B2D42">⚡ daily mode: building</text>
      <text y="18" class="mono" font-size="10" fill="#4A4E69">soundtrack: lofi &amp; synth</text>
    </g>
  </g>
</svg>
