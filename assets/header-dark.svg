<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Space Cadet Depth -->
    <linearGradient id="termBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a26" />
      <stop offset="40%" stop-color="#2B2D42" />
      <stop offset="100%" stop-color="#161722" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="termBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A8C98" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4A4E69" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9A8C98" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="softGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1s infinite; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Ambient background glow behind window -->
  <circle cx="800" cy="50" r="130" fill="#4A4E69" fill-opacity="0.22" filter="url(#softGlowDark)" />
  <circle cx="80" cy="240" r="100" fill="#2B2D42" fill-opacity="0.5" filter="url(#softGlowDark)" />

  <!-- Main Window Frame -->
  <rect x="2" y="2" width="876" height="286" rx="14" fill="url(#termBgDark)" stroke="url(#termBorderDark)" stroke-width="1.5" />

  <!-- Titlebar -->
  <path d="M 2 16 C 2 8.27 8.27 2 16 2 L 864 2 C 871.73 2 878 8.27 878 16 L 878 44 L 2 44 Z" fill="#1b1c2b" fill-opacity="0.9" />
  <line x1="2" y1="44" x2="878" y2="44" stroke="#4A4E69" stroke-width="1" stroke-opacity="0.35" />

  <!-- Window controls -->
  <circle cx="25" cy="23" r="6" fill="#FF5F56" fill-opacity="0.85" />
  <circle cx="45" cy="23" r="6" fill="#FFBD2E" fill-opacity="0.85" />
  <circle cx="65" cy="23" r="6" fill="#27C93F" fill-opacity="0.85" />

  <!-- Tab pill -->
  <g transform="translate(100, 10)">
    <rect width="180" height="26" rx="6" fill="#2B2D42" fill-opacity="0.7" stroke="#4A4E69" stroke-width="1" stroke-opacity="0.4" />
    <text x="22" y="17" fill="#F2E9E4" class="mono" font-size="12">xvanaks@dev:~</text>
  </g>

  <!-- Clean Discord text in Titlebar (no circle, no oval pill) -->
  <g transform="translate(710, 26)">
    <!-- Discord Icon -->
    <path fill="#9A8C98" d="M12.5 1.5c-1.1-.5-2.3-.9-3.5-1.1-.2.3-.3.6-.4.9-1.3-.2-2.6-.2-3.8 0-.1-.3-.3-.6-.5-.9-1.2.2-2.4.6-3.5 1.1-2.2 3.3-2.8 6.5-2.5 9.7 1.4 1.1 2.8 1.8 4.2 2.2.3-.5.7-1 1-1.5-.7-.3-1.3-.6-2-.9.2-.1.3-.3.5-.4 2.8 1.3 5.8 1.3 8.6 0 .2.1.3.3.5.4-.6.4-1.3.7-2 .9.3.5.7 1 1 1.5 1.4-.4 2.8-1.1 4.2-2.2.4-3.6-.6-6.8-2.5-9.7zm-9.8 7.9c-.8 0-1.5-.7-1.5-1.7s.7-1.7 1.5-1.7c.9 0 1.5.7 1.5 1.7 0 1-.6 1.7-1.5 1.7zm6.6 0c-.8 0-1.5-.7-1.5-1.7s.7-1.7 1.5-1.7c.9 0 1.5.7 1.5 1.7 0 1-.6 1.7-1.5 1.7z" transform="translate(0, -11) scale(1.05)"/>
    <text x="22" y="1" fill="#C9ADA7" class="mono" font-size="12.5">discord: xvanaks</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(32, 75)" class="mono" font-size="14.5" letter-spacing="0.3">
    <!-- Line 1: whoami -->
    <text y="0">
      <tspan fill="#9A8C98">~</tspan>
      <tspan fill="#4A4E69"> $ </tspan>
      <tspan fill="#F2E9E4" font-weight="600">whoami</tspan>
    </text>
    <text y="24">
      <tspan fill="#9A8C98">↳</tspan>
      <tspan fill="#FFFFFF" font-weight="700"> x1ax </tspan>
      <tspan fill="#9A8C98">(@xvanaks)</tspan>
      <tspan fill="#4A4E69"> — </tspan>
      <tspan fill="#C9ADA7" font-weight="600">фуллстек разработчик</tspan>
    </text>

    <!-- Line 2: profile info -->
    <text y="58">
      <tspan fill="#9A8C98">~</tspan>
      <tspan fill="#4A4E69"> $ </tspan>
      <tspan fill="#F2E9E4" font-weight="600">cat</tspan>
      <tspan fill="#C9ADA7"> stack.config</tspan>
    </text>

    <text y="82" fill="#C9ADA7">
      <tspan fill="#4A4E69">{</tspan>
      <tspan fill="#9A8C98"> "role":</tspan> <tspan fill="#F2E9E4">"fullstack developer"</tspan><tspan fill="#4A4E69">,</tspan>
    </text>
    <text y="104" fill="#C9ADA7">
      <tspan fill="#9A8C98">  "code":</tspan> <tspan fill="#F2E9E4">["TypeScript", "JavaScript", "React", "Node.js", "Python"]</tspan><tspan fill="#4A4E69">,</tspan>
    </text>
    <text y="126" fill="#C9ADA7">
      <tspan fill="#9A8C98">  "discord":</tspan> <tspan fill="#FFFFFF" font-weight="700">"xvanaks"</tspan>
      <tspan fill="#4A4E69"> }</tspan>
    </text>

    <!-- Line 3: interactive prompt with cursor -->
    <text y="160">
      <tspan fill="#9A8C98">~</tspan>
      <tspan fill="#4A4E69"> $ </tspan>
      <tspan fill="#F2E9E4">git commit -m </tspan>
      <tspan fill="#C9ADA7">"пока работает — не трогай"</tspan>
      <tspan class="cursor" fill="#9A8C98">█</tspan>
    </text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="2" y="258" width="876" height="30" rx="0" fill="#161722" fill-opacity="0.95" />
  <line x1="2" y1="258" x2="878" y2="258" stroke="#4A4E69" stroke-width="1" stroke-opacity="0.3" />

  <!-- Status Bar items -->
  <g transform="translate(25, 278)" class="mono" font-size="11.5">
    <text fill="#52B788">● git:(main)</text>
    <text x="110" fill="#9A8C98">UTF-8</text>
    <text x="175" fill="#C9ADA7">Fullstack</text>
  </g>

  <!-- Palette dots in footer -->
  <g transform="translate(770, 273)">
    <circle cx="10" cy="0" r="5" fill="#2B2D42" stroke="#4A4E69" stroke-width="1" />
    <circle cx="28" cy="0" r="5" fill="#4A4E69" stroke="#9A8C98" stroke-width="1" />
    <circle cx="46" cy="0" r="5" fill="#9A8C98" stroke="#C9ADA7" stroke-width="1" />
    <circle cx="64" cy="0" r="5" fill="#C9ADA7" stroke="#F2E9E4" stroke-width="1" />
  </g>
</svg>
