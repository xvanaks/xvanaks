<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean Modern Light Canvas -->
    <linearGradient id="termBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F6F6F9" />
      <stop offset="100%" stop-color="#EDEDF3" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="termBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A8C98" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#4A4E69" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2B2D42" stop-opacity="0.45" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.5; }
    }
    .cursor { animation: blink 1s infinite; }
    .live-dot { animation: pulseLive 2s infinite ease-in-out; transform-origin: 735px 23px; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Ambient background glow behind window -->
  <circle cx="800" cy="50" r="140" fill="#9A8C98" fill-opacity="0.16" filter="url(#softGlowLight)" />
  <circle cx="80" cy="240" r="110" fill="#4A4E69" fill-opacity="0.12" filter="url(#softGlowLight)" />

  <!-- Main Window Frame -->
  <rect x="2" y="2" width="876" height="286" rx="14" fill="url(#termBgLight)" stroke="url(#termBorderLight)" stroke-width="1.5" />

  <!-- Titlebar -->
  <path d="M 2 16 C 2 8.27 8.27 2 16 2 L 864 2 C 871.73 2 878 8.27 878 16 L 878 44 L 2 44 Z" fill="#E8E8EF" fill-opacity="0.9" />
  <line x1="2" y1="44" x2="878" y2="44" stroke="#9A8C98" stroke-width="1" stroke-opacity="0.35" />

  <!-- Window controls -->
  <circle cx="25" cy="23" r="6" fill="#FF5F56" fill-opacity="0.85" />
  <circle cx="45" cy="23" r="6" fill="#FFBD2E" fill-opacity="0.85" />
  <circle cx="65" cy="23" r="6" fill="#27C93F" fill-opacity="0.85" />

  <!-- Tab pill -->
  <g transform="translate(100, 10)">
    <rect width="180" height="26" rx="6" fill="#FFFFFF" stroke="#9A8C98" stroke-width="1" stroke-opacity="0.5" />
    <text x="22" y="17" fill="#2B2D42" class="mono" font-size="12" font-weight="600">x1ax@dev:~</text>
  </g>

  <!-- Live Status Badge (Titlebar Right) -->
  <g transform="translate(680, 10)">
    <rect width="175" height="26" rx="13" fill="#FFFFFF" stroke="#9A8C98" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#2D6A4F" class="live-dot" />
    <text x="28" y="17" fill="#2B2D42" class="sans" font-size="11.5" font-weight="600">discord: xvanaks</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(32, 75)" class="mono" font-size="14.5" letter-spacing="0.3">
    <!-- Line 1: whoami -->
    <text y="0">
      <tspan fill="#4A4E69">~</tspan>
      <tspan fill="#9A8C98"> $ </tspan>
      <tspan fill="#2B2D42" font-weight="700">whoami</tspan>
    </text>
    <text y="24">
      <tspan fill="#9A8C98">↳</tspan>
      <tspan fill="#2B2D42" font-weight="800"> x1ax </tspan>
      <tspan fill="#4A4E69">(sahanikityuk-cmyk)</tspan>
      <tspan fill="#9A8C98"> — </tspan>
      <tspan fill="#2B2D42">разработчик / делаю веб-штуки</tspan>
    </text>

    <!-- Line 2: profile info -->
    <text y="58">
      <tspan fill="#4A4E69">~</tspan>
      <tspan fill="#9A8C98"> $ </tspan>
      <tspan fill="#2B2D42" font-weight="700">cat</tspan>
      <tspan fill="#4A4E69"> stack.config</tspan>
    </text>

    <text y="82" fill="#2B2D42">
      <tspan fill="#9A8C98">{</tspan>
      <tspan fill="#4A4E69"> "code":</tspan> <tspan fill="#2B2D42">["JavaScript", "TypeScript", "React", "Python"]</tspan><tspan fill="#9A8C98">,</tspan>
    </text>
    <text y="104" fill="#2B2D42">
      <tspan fill="#4A4E69">  "style":</tspan> <tspan fill="#2B2D42">"аккуратный UI, тёмные темы, без оверинжиниринга"</tspan><tspan fill="#9A8C98">,</tspan>
    </text>
    <text y="126" fill="#2B2D42">
      <tspan fill="#4A4E69">  "reach":</tspan> <tspan fill="#4A4E69">"Discord → </tspan><tspan fill="#2B2D42" font-weight="800">xvanaks</tspan><tspan fill="#4A4E69">"</tspan>
      <tspan fill="#9A8C98"> }</tspan>
    </text>

    <!-- Line 3: interactive prompt with cursor -->
    <text y="160">
      <tspan fill="#4A4E69">~</tspan>
      <tspan fill="#9A8C98"> $ </tspan>
      <tspan fill="#2B2D42" font-weight="600">git commit -m </tspan>
      <tspan fill="#4A4E69">"пока работает — не трогай"</tspan>
      <tspan class="cursor" fill="#2B2D42">█</tspan>
    </text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="2" y="258" width="876" height="30" rx="0" fill="#E8E8EF" fill-opacity="0.95" />
  <line x1="2" y1="258" x2="878" y2="258" stroke="#9A8C98" stroke-width="1" stroke-opacity="0.3" />

  <!-- Status Bar items -->
  <g transform="translate(25, 278)" class="mono" font-size="11.5">
    <text fill="#2D6A4F" font-weight="600">● git:(main)</text>
    <text x="110" fill="#4A4E69">UTF-8</text>
    <text x="175" fill="#2B2D42">TypeScript</text>
  </g>

  <!-- Palette dots in footer -->
  <g transform="translate(770, 273)">
    <circle cx="10" cy="0" r="5" fill="#2B2D42" stroke="#9A8C98" stroke-width="1" />
    <circle cx="28" cy="0" r="5" fill="#4A4E69" stroke="#9A8C98" stroke-width="1" />
    <circle cx="46" cy="0" r="5" fill="#9A8C98" stroke="#4A4E69" stroke-width="1" />
    <circle cx="64" cy="0" r="5" fill="#C9ADA7" stroke="#4A4E69" stroke-width="1" />
  </g>
</svg>
